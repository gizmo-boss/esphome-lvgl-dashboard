time:
  - id: ha_time
    platform: homeassistant
    on_time_sync:
      - lvgl.label.update:
          id: nav_clock
          text:
            time_format: "%H:%M:%S"
            time: ha_time
    on_time:
      - seconds: '*'
        then:
          - lvgl.label.update:
              id: nav_clock
              text:
                time_format: "%H:%M:%S"
                time: ha_time
