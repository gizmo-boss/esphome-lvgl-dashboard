obj:
  id: settings_panel
  width: 100%
  height: 100%
  bg_color: ${color_bg}
  bg_opa: 98%
  hidden: true
  scrollbar_mode: "off"
  pad_left: 12
  pad_right: 12
  pad_top: 6
  pad_bottom: 12
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: START
    pad_row: 12
  widgets:
  # Header bar (matches light/climate control panel headers)
  - obj:
      width: 100%
      height: 50
      bg_opa: TRANSP
      border_width: 0
      scrollbar_mode: "off"
      widgets:
      - label:
          text: "\U000F0493"
          text_font: mdi_lg
          text_color: ${color_accent}
          align: LEFT_MID
          x: 6
      - label:
          text: "Settings"
          text_font: roboto_lg
          text_color: ${color_text_primary}
          align: LEFT_MID
          x: 44
      - button:
          width: 50
          height: 50
          align: RIGHT_MID
          bg_color: ${color_surface}
          radius: 20
          border_width: 0
          on_click:
          - script.execute: hide_settings
          widgets:
          - label:
              text: "\U000F0156"
              text_font: mdi_lg
              text_color: ${color_danger}
              align: CENTER
  # Separator
  - obj:
      width: 100%
      height: 2
      bg_color: ${color_border}
      border_width: 0
      radius: 1
      scrollbar_mode: "off"
  # Brightness control card
  - obj:
      width: 100%
      height: 96
      bg_color: ${color_surface}
      radius: 20
      border_width: 0
      pad_all: 12
      scrollbar_mode: "off"
      scrollable: false
      layout:
        type: FLEX
        flex_flow: COLUMN
        pad_row: 8
      widgets:
      - obj:
          width: 100%
          height: 28
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollbar_mode: "off"
          scrollable: false
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_cross: CENTER
            pad_column: 8
          widgets:
          - label:
              text: "\U000F00E0"
              text_font: mdi_md
              text_color: ${color_warning}
          - label:
              text: "Brightness"
              text_font: roboto_sm
              text_color: ${color_text_muted}
      - slider:
          id: brightness_slider
          width: 100%
          height: 24
          min_value: 10
          max_value: 100
          value: 100
          bg_color: ${color_surface_alt}
          indicator:
            bg_color: ${color_warning}
          knob:
            bg_color: ${color_outline}
            radius: 12
          on_value:
          - light.turn_on:
              id: backlight
              brightness: !lambda return x / 100.0;
          - globals.set:
              id: brightness_level
              value: !lambda return x / 100.0;
  # Auto-off toggle card
  - button:
      width: 100%
      height: 70
      bg_color: ${color_surface}
      radius: 20
      border_width: 0
      pad_left: 12
      pad_right: 12
      scrollbar_mode: "off"
      scrollable: false
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_cross: CENTER
        pad_column: 12
      on_click:
      - script.execute: toggle_auto_off
      widgets:
      # Flat children only: a covering obj here would swallow the tap
      # before it reaches the button underneath.
      - label:
          text: "\U000F0425"
          text_font: mdi_lg
          text_color: ${color_accent}
      - label:
          text: "Auto Screen Off"
          text_font: roboto_md
          text_color: ${color_text_primary}
          flex_grow: 1
      - obj:
          id: auto_off_checked
          width: 44
          height: 44
          bg_color: ${color_success}
          radius: 20
          border_width: 0
          widgets:
          - label:
              text: "\U000F012C"
              text_font: mdi_lg
              text_color: ${color_text_primary}
              align: CENTER
      - obj:
          id: auto_off_unchecked
          width: 44
          height: 44
          bg_color: ${color_surface_alt}
          radius: 20
          border_width: 2
          border_color: ${color_text_muted}
          hidden: true
  # Air alert screen-on toggle card
  - button:
      width: 100%
      height: 70
      bg_color: ${color_surface}
      radius: 20
      border_width: 0
      pad_left: 12
      pad_right: 12
      scrollbar_mode: "off"
      scrollable: false
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_cross: CENTER
        pad_column: 12
      on_click:
      - script.execute: toggle_air_alert_screen
      widgets:
      - label:
          text: "\U000F078F"
          text_font: mdi_lg
          text_color: ${color_danger}
      - label:
          text: "Screen On for Air Alerts"
          text_font: roboto_md
          text_color: ${color_text_primary}
          flex_grow: 1
      - obj:
          id: air_alert_screen_checked
          width: 44
          height: 44
          bg_color: ${color_success}
          radius: 20
          border_width: 0
          widgets:
          - label:
              text: "\U000F012C"
              text_font: mdi_lg
              text_color: ${color_text_primary}
              align: CENTER
      - obj:
          id: air_alert_screen_unchecked
          width: 44
          height: 44
          bg_color: ${color_surface_alt}
          radius: 20
          border_width: 2
          border_color: ${color_text_muted}
          hidden: true
  # Separator before info section
  - obj:
      width: 100%
      height: 2
      bg_color: ${color_border}
      border_width: 0
      radius: 1
      scrollbar_mode: "off"
  # Device info row
  - obj:
      width: 100%
      height: 40
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollbar_mode: "off"
      scrollable: false
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_cross: CENTER
        pad_column: 8
      widgets:
      - label:
          id: ha_status_icon
          text: "\U000F05A9"
          text_font: mdi_md
          text_color: ${color_danger}
      - label:
          id: ha_status_value
          text: "Connecting..."
          text_font: roboto_sm
          text_color: ${color_text_muted}
