# required vars:
# - uid
# - entity_id
# - width
# - height
# - text

# button:
<<: !include
  file: ../stateful.yaml
  vars:
    uid: ${uid}
    entity_id: ${entity_id}
    width: ${width}
    height: ${height}
    icon_on: "󰛨"
    icon_off: "󰌶"
    text: ${text}
on_short_click:
- homeassistant.service:
    action: switch.toggle
    data:
      entity_id: ${entity_id}
# Hold to force off. These are switch entities, so the previous
# `brightness_pct: '1'` had no effect other than an error in the Home
# Assistant log -- switch.turn_on takes no brightness.
on_long_press:
- homeassistant.service:
    action: switch.turn_off
    data:
      entity_id: ${entity_id}
