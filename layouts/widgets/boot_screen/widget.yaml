# widgets:
  - obj:
      id: boot_screen
      x: 0
      y: 0
      width: 100%
      height: 100%
      bg_color: ${color_bg}
      bg_opa: COVER
      radius: 0
      pad_all: 0
      border_width: 0
      widgets:
        - image:
            src: boot_logo
            align: CENTER
            y: -40
        - spinner:
            align: CENTER
            y: 95
            height: 50
            width: 50
            spin_time: 1s
            arc_length: 60deg
            arc_width: 8
            indicator:
              arc_color: ${color_accent}
              arc_width: 8
        - label:
            id: boot_screen_status
            align: CENTER
            y: 150
            text: " "
            text_font: roboto_sm
            text_color: ${color_text_muted}
      on_press:
        - lvgl.widget.hide: boot_screen
