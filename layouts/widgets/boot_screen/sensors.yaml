api:
  on_client_connected:
    - lvgl.widget.hide: boot_screen

# The boot screen otherwise waits on the API forever: if Home Assistant
# never answers, the spinner spins with no way for the user to tell why.
esphome:
  on_boot:
    priority: -100
    then:
      - delay: 10s
      - if:
          condition:
            lambda: 'return !id(api_connected);'
          then:
            - lvgl.label.update:
                id: boot_screen_status
                text: "No connection to Home Assistant\ntap to continue"

image:
  - file: https://esphome.io/favicon-512x512.png
    id: boot_logo
    resize: 200x200
    type: RGB565
    transparency: alpha_channel
