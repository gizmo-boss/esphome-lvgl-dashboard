- id: go_home
  then:
  - lvgl.page.show: bedroom

- id: turn_off_display
  then:
  - globals.set:
      id: display_on
      value: 'false'
  - light.turn_off: backlight
  # Pausing LVGL is what makes the wake-up touch harmless: while paused,
  # LVTouchListener::update() forces touch_pressed_ = false, so the press
  # never reaches a widget. It also stops rendering entirely while asleep.
  - lvgl.pause:

# Light the screen back up without letting the waking touch through.
# LVGL stays paused here on purpose - it is resumed on touch release
# (see device.yaml), by which time the press has already been discarded.
- id: wake_display
  then:
  - globals.set:
      id: display_on
      value: 'true'
  - lambda: 'id(last_touch_time) = millis();'
  - light.turn_on:
      id: backlight
      brightness: !lambda return id(brightness_level);

- id: turn_on_display
  then:
  - script.execute: wake_display
  - lvgl.resume:
  - script.execute: go_home

# Single place that renders link state. Three states, because "no Wi-Fi" and
# "Wi-Fi up but Home Assistant unreachable" mean very different things to the
# person looking at stale numbers on screen.
- id: update_link_status
  then:
  - if:
      condition:
        lambda: 'return !id(wifi_connected);'
      then:
      - lvgl.label.update:
          id: wifi_icon
          text_color: ${color_danger}
      - lvgl.label.update:
          id: ha_status_icon
          text_color: ${color_danger}
      - lvgl.label.update:
          id: ha_status_value
          text: "No Wi-Fi connection"
      else:
      - if:
          condition:
            lambda: 'return !id(api_connected);'
          then:
          - lvgl.label.update:
              id: wifi_icon
              text_color: ${color_warning}
          - lvgl.label.update:
              id: ha_status_icon
              text_color: ${color_warning}
          - lvgl.label.update:
              id: ha_status_value
              text: "Home Assistant unreachable"
          else:
          - lvgl.label.update:
              id: wifi_icon
              text_color: ${color_text_muted}
          - lvgl.label.update:
              id: ha_status_icon
              text_color: ${color_success}
          - lvgl.label.update:
              id: ha_status_value
              text: "Connected to Home Assistant"

- id: show_settings
  then:
  - lvgl.widget.show: settings_panel

- id: hide_settings
  then:
  - lvgl.widget.hide: settings_panel

- id: toggle_auto_off
  then:
  - lambda: |-
      id(auto_off_enabled) = !id(auto_off_enabled);
  - if:
      condition:
        lambda: 'return id(auto_off_enabled);'
      then:
      - lvgl.widget.show: auto_off_checked
      - lvgl.widget.hide: auto_off_unchecked
      else:
      - lvgl.widget.hide: auto_off_checked
      - lvgl.widget.show: auto_off_unchecked

- id: toggle_air_alert_screen
  then:
  - lambda: |-
      id(keep_screen_on_air_alert) = !id(keep_screen_on_air_alert);
  - if:
      condition:
        lambda: 'return id(keep_screen_on_air_alert);'
      then:
      - lvgl.widget.show: air_alert_screen_checked
      - lvgl.widget.hide: air_alert_screen_unchecked
      else:
      - lvgl.widget.hide: air_alert_screen_checked
      - lvgl.widget.show: air_alert_screen_unchecked

# Light control panel scripts
- id: show_light_control
  parameters:
    light_entity: string
    light_uid: string
  then:
  - globals.set:
      id: current_light_entity
      value: !lambda return light_entity;
  - lvgl.label.update:
      id: light_control_title
      text: !lambda |-
        if (light_uid == "stylage_light") return "Stylage";
        return "Light Control";
  - lvgl.widget.show: light_control_panel

- id: hide_light_control
  then:
  - lvgl.widget.hide: light_control_panel

- id: update_light_brightness
  parameters:
    brightness: int
  then:
  - globals.set:
      id: current_light_brightness
      value: !lambda return brightness;
  - lvgl.label.update:
      id: light_brightness_value
      text: !lambda |-
        char buf[8];
        snprintf(buf, sizeof(buf), "%d%%", (brightness * 100) / 255);
        return std::string(buf);
  # Repaint the preview swatch from the same single implementation used by
  # the hue and saturation paths.
  - script.execute: refresh_light_preview
  - homeassistant.service:
      action: light.turn_on
      data_template:
        entity_id: !lambda return id(current_light_entity);
        brightness: !lambda return std::to_string(id(current_light_brightness));

- id: update_light_color
  parameters:
    hue: int
  then:
  - globals.set:
      id: current_light_hue
      value: !lambda return hue;
  - script.execute:
      id: apply_light_hs_color

# The only HSV -> RGB implementation in the project. Previously this
# conversion was written out twice, ~30 lines each, and the copies had
# already drifted: one of them updated the arc indicator colour, the other
# did not.
- id: refresh_light_preview
  then:
  - lambda: |-
      const int h = id(current_light_hue);
      const int s = id(current_light_saturation);
      const int v = id(current_light_brightness) * 100 / 255;

      auto hsv_to_rgb = [](float h, float s, float v) -> uint32_t {
        const float hf = h / 60.0f;
        const int   hi = (int) hf % 6;
        const float f  = hf - (int) hf;
        const float p  = v * (1 - s);
        const float q  = v * (1 - f * s);
        const float t  = v * (1 - (1 - f) * s);
        float r, g, b;
        switch (hi) {
          case 0:  r = v; g = t; b = p; break;
          case 1:  r = q; g = v; b = p; break;
          case 2:  r = p; g = v; b = t; break;
          case 3:  r = p; g = q; b = v; break;
          case 4:  r = t; g = p; b = v; break;
          default: r = v; g = p; b = q; break;
        }
        return ((int) (r * 255) << 16) | ((int) (g * 255) << 8) | (int) (b * 255);
      };

      // Swatch shows the colour as it will actually look, brightness included.
      lv_obj_set_style_bg_color(id(light_color_preview),
                                lv_color_hex(hsv_to_rgb(h, s / 100.0f, v / 100.0f)),
                                LV_PART_MAIN);
      // Arc indicator shows the pure hue, so the wheel stays readable at any
      // brightness or saturation.
      lv_obj_set_style_arc_color(id(light_hue_arc),
                                 lv_color_hex(hsv_to_rgb(h, 1.0f, 1.0f)),
                                 LV_PART_INDICATOR);

- id: apply_light_hs_color
  then:
  - script.execute: refresh_light_preview
  - homeassistant.service:
      action: light.turn_on
      data_template:
        entity_id: !lambda return id(current_light_entity);
        hs_color: !lambda |-
          return "[" + std::to_string(id(current_light_hue)) + ", " + std::to_string(id(current_light_saturation)) + "]";

- id: set_light_preset
  parameters:
    preset: string
  then:
  - lambda: |-
      int h = 30, s = 100;
      if (preset == "white") { h = 0; s = 0; }
      else if (preset == "warm") { h = 30; s = 80; }
      else if (preset == "red") { h = 0; s = 100; }
      else if (preset == "green") { h = 120; s = 100; }
      else if (preset == "blue") { h = 220; s = 100; }
      else if (preset == "purple") { h = 280; s = 100; }
      
      id(current_light_hue) = h;
      id(current_light_saturation) = s;

      lv_arc_set_value(id(light_hue_arc), h);
  - script.execute:
      id: apply_light_hs_color

# Climate control panel scripts
- id: show_climate_control
  parameters:
    entity_id: string
    name: string
    has_fan: string
  then:
  - globals.set:
      id: current_climate_entity
      value: !lambda return entity_id;
  - globals.set:
      id: current_climate_has_fan
      value: !lambda return has_fan == "true";
  - lvgl.label.update:
      id: climate_control_title
      text: !lambda return name;
  # Load current temperatures from sensors
  - lambda: |-
      float current = 0;
      float target = 24;
      std::string status = "off";
      
      if (entity_id == "climate.thermostat_thermostat") {
        current = id(thermostat_current_temp_sensor).state;
        target = id(thermostat_target_temp_sensor).state;
        status = id(thermostat_hvac_state).state;
      } else if (entity_id == "climate.c6a1a756") {
        current = id(livingroom_ac_current_temp_sensor).state;
        target = id(livingroom_ac_target_temp_sensor).state;
        status = id(livingroom_ac_hvac_state).state;
      } else if (entity_id == "climate.c6a1ab8f") {
        current = id(bedroom_ac_current_temp_sensor).state;
        target = id(bedroom_ac_target_temp_sensor).state;
        status = id(bedroom_ac_hvac_state).state;
      }
      
      // Update current temp display
      if (!std::isnan(current)) {
        char buf[8];
        snprintf(buf, sizeof(buf), "%.0f", current);
        lv_label_set_text(id(climate_current_temp_big), buf);
      }
      
      // Update target temp
      if (!std::isnan(target)) {
        id(current_climate_target) = (int)target;
        lv_arc_set_value(id(climate_temp_arc), (int)target);
        char buf[16];
        snprintf(buf, sizeof(buf), "%.0f°C", target);
        lv_label_set_text(id(climate_target_temp_big), buf);
      }
      
      // Update status
      lv_label_set_text(id(climate_control_status), status.c_str());
      
      // Update icon based on device type
      if (entity_id == "climate.thermostat_thermostat") {
        lv_label_set_text(id(climate_control_icon), "\U000F0393"); // thermostat icon
      } else {
        lv_label_set_text(id(climate_control_icon), "\U000F001B"); // AC icon
      }
      
      // Update icon color based on mode
      uint32_t icon_color = ${color_cool}; // default blue
      if (status == "heat") icon_color = ${color_heat};
      else if (status == "cool") icon_color = ${color_cool};
      else if (status == "auto" || status == "fan_only") icon_color = ${color_auto};
      else if (status == "off") icon_color = ${color_text_muted};
      lv_obj_set_style_text_color(id(climate_control_icon), lv_color_hex(icon_color), LV_PART_MAIN);
  # Show/hide fan row based on device type
  - if:
      condition:
        lambda: return has_fan == "true";
      then:
      - lvgl.widget.show: climate_fan_row
      else:
      - lvgl.widget.hide: climate_fan_row
  - lvgl.widget.show: climate_control_panel

- id: hide_climate_control
  then:
  - lvgl.widget.hide: climate_control_panel

- id: update_climate_temp
  parameters:
    temp: int
  then:
  - globals.set:
      id: current_climate_target
      value: !lambda return temp;
  - lvgl.label.update:
      id: climate_target_temp_big
      text: !lambda |-
        char buf[16];
        snprintf(buf, sizeof(buf), "%d°C", temp);
        return std::string(buf);
  - homeassistant.service:
      action: climate.set_temperature
      data_template:
        entity_id: !lambda return id(current_climate_entity);
        temperature: !lambda return std::to_string(id(current_climate_target));

- id: adjust_climate_temp
  parameters:
    delta: int
  then:
  - lambda: |-
      int new_temp = id(current_climate_target) + delta;
      if (new_temp < 16) new_temp = 16;
      if (new_temp > 30) new_temp = 30;
      id(current_climate_target) = new_temp;
      lv_arc_set_value(id(climate_temp_arc), new_temp);
  - lvgl.label.update:
      id: climate_target_temp_big
      text: !lambda |-
        char buf[16];
        snprintf(buf, sizeof(buf), "%d°C", id(current_climate_target));
        return std::string(buf);
  - homeassistant.service:
      action: climate.set_temperature
      data_template:
        entity_id: !lambda return id(current_climate_entity);
        temperature: !lambda return std::to_string(id(current_climate_target));

- id: set_climate_mode
  parameters:
    mode: string
  then:
  - homeassistant.service:
      action: climate.set_hvac_mode
      data_template:
        entity_id: !lambda return id(current_climate_entity);
        hvac_mode: !lambda return mode;

- id: set_climate_fan
  parameters:
    fan: string
  then:
  - homeassistant.service:
      action: climate.set_fan_mode
      data_template:
        entity_id: !lambda return id(current_climate_entity);
        fan_mode: !lambda return fan;

- id: update_battery_display
  then:
  - lambda: |-
      float soc = id(battery_soc).state;
      if (std::isnan(soc)) {
        lv_label_set_text(id(battery_soc_value), "--%");
        lv_obj_set_width(id(battery_soc_fill), 0);
        lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_text_muted}), LV_PART_MAIN);
        return;
      }
      int percent = (int)std::round(soc);
      char buf[16];
      snprintf(buf, sizeof(buf), "%d%%", percent);
      lv_label_set_text(id(battery_soc_value), buf);
      
      int container_width = lv_obj_get_width(id(battery_container));
      int container_height = lv_obj_get_height(id(battery_container));
      if (container_width > 0) {
        lv_obj_set_width(id(battery_soc_fill), (container_width * percent) / 100);
        lv_obj_set_height(id(battery_soc_fill), container_height);
      }
      
      if (percent >= 60) {
        lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_success}), LV_PART_MAIN);
      } else if (percent >= 30) {
        lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_warning}), LV_PART_MAIN);
      } else {
        lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_danger}), LV_PART_MAIN);
      }
