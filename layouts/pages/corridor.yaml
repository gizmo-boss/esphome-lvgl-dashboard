id: corridor
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Hall
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 10
    widgets:
    # Separator at the top
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - button:
        # corridor light
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
          vars:
            uid: corridor_light
            entity_id: switch.sonoff_1001275136_2
            text: Hall
            width: 49%
            height: 86
    - button:
        # closet light
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
          vars:
            uid: closet_light
            entity_id: switch.sonoff_1000b1b936_3
            text: Closet
            width: 49%
            height: 86
    # Separator before Temp/Humidity
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: corridor_temp
            icon: "\U000F050F"
            icon_color: ${color_danger}
            label: Temperature
            unit: "°C"
            width: 49%
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: corridor_humidity
            icon: "\U000F058E"
            icon_color: ${color_humidity}
            label: Humidity
            unit: "%"
            width: 49%
