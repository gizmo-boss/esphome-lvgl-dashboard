id: climate
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Climate
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 8
    widgets:
    # ============ THERMOSTAT ============
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
        scrollable: false
    # Thermostat card - clickable
    - button:
        id: thermostat_card
        width: 100%
        height: 80
        bg_color: ${color_surface}
        radius: 12
        border_width: 0
        on_click:
        - script.execute:
            id: show_climate_control
            entity_id: "climate.thermostat_thermostat"
            name: "Underfloor"
            has_fan: "false"
        widgets:
        # Icon circle
        - obj:
            id: thermostat_icon_circle
            width: 50
            height: 50
            radius: 25
            bg_color: ${color_surface_alt}
            border_width: 0
            align: LEFT_MID
            x: 12
            scrollbar_mode: "off"
            scrollable: false
            widgets:
            - label:
                id: thermostat_icon
                text: "\U000F0393"
                text_font: mdi_lg
                text_color: ${color_icon_muted}
                align: CENTER
        # Title & status
        - label:
            text: "Underfloor"
            text_font: roboto_md
            text_color: ${color_text_primary}
            x: 72
            y: 16
        - label:
            id: thermostat_status
            text: "off"
            text_font: roboto_sm
            text_color: ${color_text_muted}
            x: 72
            y: 40
        # Temperatures on right
        - label:
            id: thermostat_current_temp
            text: "--°"
            text_font: roboto_xl
            text_color: ${color_text_primary}
            align: RIGHT_MID
            x: -60
        - label:
            id: thermostat_target_temp
            text: "--°"
            text_font: roboto_lg
            text_color: ${color_heat}
            align: RIGHT_MID
            x: -12

    # ============ LIVING ROOM AC ============
