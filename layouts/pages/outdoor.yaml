id: outdoor
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Outdoor
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 10
    widgets:
    # Separator before Temp/Humidity
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: outdoor_temp
            icon: "\U000F050F"
            icon_color: ${color_danger}
            label: Temperature
            unit: "°C"
            width: 49%
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: outdoor_humidity
            icon: "\U000F058E"
            icon_color: ${color_humidity}
            label: Humidity
            unit: "%"
            width: 49%
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: outdoor_pressure
            icon: "\U000F0874"
            icon_color: ${color_pressure}
            label: Pressure
            unit: hPa
            width: 49%
