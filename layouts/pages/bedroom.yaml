id: bedroom
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Bedroom
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 10
    widgets:
    # Separator at the top
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - button:
        # Bedroom Light
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
          vars:
            uid: bedroom_light
            entity_id: switch.sonoff_10012750d9_1
            text: Main
            width: 49%
            height: 86
    - button:
        # torsher
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
          vars:
            uid: torsher
            entity_id: switch.bedroom_floor_lamp
            text: Torsher
            width: 49%
            height: 86
    - button:
        # Stylage RGB Light (with color control)
        <<: !include
          file: ../widgets/buttons/icon_text_buttons/rgb_light_buttons/widget.yaml
          vars:
            uid: stylage_light
            entity_id: light.stylage_rgb_light
            text: Stylage
            width: 100%
            height: 86

    # Separator before Temp/Humidity
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: bedroom_temp
            icon: "\U000F050F"
            icon_color: ${color_danger}
            label: Temperature
            unit: "°C"
            width: 49%
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: bedroom_humidity
            icon: "\U000F058E"
            icon_color: ${color_humidity}
            label: Humidity
            unit: "%"
            width: 49%
