id: air_alerts
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Air Alerts
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 10
    widgets:
    # Separator at the top
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        # air alert status
        width: 100%
        height: 100
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        - label:
            id: air_alert_status_icon
            text_font: mdi_xl
            text: "\U000F078F"
            text_color: ${color_success}
            align: LEFT_MID
            x: -10
        - label:
            text: "Air Alert"
            text_font: roboto_sm
            text_color: ${color_text_muted}
            align: LEFT_MID
            x: 30
            y: -18
        - label:
            id: air_alert_status_value
            text: "..."
            text_font: roboto_xl
            align: LEFT_MID
            x: 30
            y: 14
    # Separator before alert count
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        # alerts today count
        width: 49%
        height: 70
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        - label:
            text_font: mdi_xl
            text: "\U000F0028"
            text_color: ${color_amber}
            align: LEFT_MID
            x: -10
        - label:
            text: "Alerts Today"
            text_font: roboto_sm
            text_color: ${color_text_muted}
            align: LEFT_MID
            x: 30
            y: -18
        - label:
            id: air_alert_today_count_value
            text: "..."
            text_font: roboto_xl
            align: LEFT_MID
            x: 30
            y: 14
