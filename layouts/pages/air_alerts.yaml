id: air_alerts
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Air Alerts
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 10
    widgets:
    # Separator at the top
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    # Full width: "Alert Active" measures 164 px at 32 px, which does not
    # fit a half-width card.
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: air_alert_status
            icon: "\U000F078F"
            icon_color: ${color_success}
            label: Air Alert
            unit: " "
            width: 100%
    # Separator before alert count
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: air_alert_today_count
            icon: "\U000F0028"
            icon_color: ${color_amber}
            label: Alerts Today
            unit: " "
            width: 100%
    # Separator before alert duration
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: air_alert_duration
            icon: "\U000F0150"
            icon_color: ${color_danger}
            label: Alert Duration
            unit: " "
            width: 100%
