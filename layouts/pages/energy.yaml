id: energy
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Energy
- delay: 100ms
- script.execute: update_battery_display
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 10
    widgets:
    # Separator at the top
    - obj:
        width: 100%
        height: 2
        bg_color: 0x555555
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    # Row 1: Grid Power & Voltage
    - obj:
        width: 49%
        height: 70
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        - label:
            text_font: mdi_xl
            text: "\U000F0241"
            text_color: 0xFFCC00
            align: LEFT_MID
            x: -10
        - label:
            text: "Grid Power"
            text_font: roboto_sm
            text_color: 0x888888
            align: LEFT_MID
            x: 30
            y: -18
        - label:
            id: power_value
            text: "--"
            text_font: roboto_xl
            align: LEFT_MID
            x: 30
            y: 14
    - obj:
        width: 49%
        height: 70
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        - label:
            text_font: mdi_xl
            text: "\U000F140B"
            text_color: 0x00CCFF
            align: LEFT_MID
            x: -10
        - label:
            text: "Voltage"
            text_font: roboto_sm
            text_color: 0x888888
            align: LEFT_MID
            x: 30
            y: -18
        - label:
            id: voltage_value
            text: "--"
            text_font: roboto_xl
            align: LEFT_MID
            x: 30
            y: 14
    # Separator between Grid and Battery
    - obj:
        width: 100%
        height: 2
        bg_color: 0x555555
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    # Row 2: Battery SoC - horizontal battery with percentage inside
    - obj:
        width: 100%
        height: 50
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        # Battery terminal (left side)
        - obj:
            width: 8
            height: 20
            bg_color: 0xFFFFFF
            border_width: 0
            radius: 2
            align: LEFT_MID
            x: 6
            scrollbar_mode: "off"
        # Battery container (main body)
        - obj:
            id: battery_container
            width: 92%
            height: 40
            bg_color: 0x2A2E38
            border_width: 2
            border_color: 0xFFFFFF
            radius: 4
            align: RIGHT_MID
            x: -10
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
            # Filled part indicator (for color change) - full height, fills from right
            - obj:
                id: battery_soc_fill
                width: 0
                height: 100%
                bg_color: 0x4CAF50
                border_width: 0
                radius: 2
                align: RIGHT_MID
                pad_all: 0
                scrollbar_mode: "off"
            # Percentage text inside battery
            - label:
                id: battery_soc_value
                text: "--%"
                text_font: roboto_lg
                text_color: 0xFFFFFF
                align: CENTER
            # Energy value in brackets (smaller font) - right of percentage
            - label:
                id: battery_energy_value
                text: ""
                text_font: roboto_sm
                text_color: 0xFFFFFF
                align: RIGHT_MID
                x: -10
    # Row 3: Battery Voltage & Power
    - obj:
        width: 49%
        height: 70
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        - label:
            text_font: mdi_xl
            text: "\U000F12A3"
            text_color: 0x9575CD
            align: LEFT_MID
            x: -10
        - label:
            text: "Batt Voltage"
            text_font: roboto_sm
            text_color: 0x888888
            align: LEFT_MID
            x: 30
            y: -18
        - label:
            id: battery_voltage_value
            text: "--"
            text_font: roboto_xl
            align: LEFT_MID
            x: 30
            y: 14
    - obj:
        width: 49%
        height: 70
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        - label:
            text_font: mdi_xl
            id: battery_power_icon
            text: "\U000F0241"
            text_color: 0x4CAF50
            align: LEFT_MID
            x: -10
        - label:
            text: "Batt Power"
            text_font: roboto_sm
            text_color: 0x888888
            align: LEFT_MID
            x: 30
            y: -18
        - label:
            id: battery_power_value
            text: "--"
            text_font: roboto_xl
            align: LEFT_MID
            x: 20
            y: 14
    # Separator between Battery and New Sensors
    - obj:
        width: 100%
        height: 2
        bg_color: 0x555555
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    # Row 4: Battery Time Dynamic
    - obj:
        width: 100%
        height: 86
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        - label:
            id: battery_time_icon
            text_font: mdi_lg
            text: "\U000F19E5"
            text_color: 0x888888
            align: LEFT_MID
            x: -5
        - label:
            id: battery_time_primary
            text: "--"
            text_font: roboto_sm
            text_color: 0x888888
            align: LEFT_MID
            x: 30
            y: -18
        - label:
            id: battery_time_secondary
            text: "--"
            text_font: roboto_xl
            text_color: 0xFFFFFF
            align: LEFT_MID
            x: 30
            y: 14
