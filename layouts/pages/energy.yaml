id: energy
pad_top: 50
pad_bottom: 50
scrollbar_mode: "off"
on_load:
- lvgl.label.update:
    id: page_title
    text: Energy
# TODO(P1-6): this delay exists only because the hand-built battery gauge
# reads lv_obj_get_width() before the first layout pass. It goes away with
# the switch to a native bar widget.
- delay: 100ms
- script.execute: update_battery_display
widgets:
- obj:
    width: 100%
    height: 100%
    border_width: 0
    radius: 0
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6
    scrollbar_mode: "off"
    scrollable: false
    layout:
      type: FLEX
      flex_flow: ROW_WRAP
      flex_align_main: START
      pad_column: 8
      pad_row: 10
    widgets:
    # Separator at the top
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    # Row 1: Grid Power & Voltage
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: power
            icon: "\U000F0241"
            icon_color: ${color_warning}
            label: Grid Power
            unit: kW
            width: 49%
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: voltage
            icon: "\U000F140B"
            icon_color: ${color_humidity}
            label: Voltage
            unit: V
            width: 49%
    # Separator between Grid and Battery
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    # Row 2: Battery SoC - horizontal battery with percentage inside
    - obj:
        width: 100%
        height: 50
        bg_opa: TRANSP
        border_width: 0
        scrollbar_mode: "off"
        widgets:
        # Battery terminal (left side)
        - obj:
            width: 8
            height: 20
            bg_color: ${color_outline}
            border_width: 0
            radius: 2
            align: LEFT_MID
            x: 6
            scrollbar_mode: "off"
        # Battery container (main body)
        - obj:
            id: battery_container
            width: 92%
            height: 40
            bg_color: ${color_surface}
            border_width: 2
            border_color: ${color_outline}
            radius: 4
            align: RIGHT_MID
            x: -10
            pad_all: 0
            scrollbar_mode: "off"
            widgets:
            # Filled part indicator (for color change) - full height, fills from right
            - obj:
                id: battery_soc_fill
                width: 0
                height: 100%
                bg_color: ${color_success}
                border_width: 0
                radius: 2
                align: RIGHT_MID
                pad_all: 0
                scrollbar_mode: "off"
            # Percentage text inside battery
            - label:
                id: battery_soc_value
                text: "--%"
                text_font: roboto_lg
                text_color: ${color_text_primary}
                align: CENTER
            # Energy value in brackets (smaller font) - right of percentage
            - label:
                id: battery_energy_value
                text: ""
                text_font: roboto_sm
                text_color: ${color_text_primary}
                align: RIGHT_MID
                x: -10
    # Row 3: Battery Voltage & Power
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: battery_voltage
            icon: "\U000F12A3"
            icon_color: ${color_pressure}
            label: Batt Voltage
            unit: V
            width: 49%
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: battery_power
            icon: "\U000F0241"
            icon_color: ${color_success}
            label: Batt Power
            unit: W
            width: 49%
    # Separator between Battery and New Sensors
    - obj:
        width: 100%
        height: 2
        bg_color: ${color_border}
        border_width: 0
        radius: 1
        scrollbar_mode: "off"
    # Row 4: Battery Time Dynamic. Caption and value are both driven by the
    # sensor, so this card uses the generated ${uid}_label id.
    - obj:
        <<: !include
          file: ../widgets/stat_card/widget.yaml
          vars:
            uid: battery_time
            icon: "\U000F19E5"
            icon_color: ${color_text_muted}
            label: "--"
            unit: " "
            width: 100%
