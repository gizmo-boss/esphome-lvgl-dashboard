- id: auto_off_enabled
  type: bool
  restore_value: yes
  initial_value: 'true'
# Link state, mirrored from the wifi/api triggers in common.yaml so that
# update_link_status can render both halves without querying the components.
- id: wifi_connected
  type: bool
  restore_value: no
  initial_value: 'false'
- id: api_connected
  type: bool
  restore_value: no
  initial_value: 'false'
- id: brightness_level
  type: float
  restore_value: yes
  initial_value: '1.0'
- id: battery_time_status_str
  type: std::string
  restore_value: no
  initial_value: ''
- id: battery_energy_remaining_val
  type: float
  restore_value: no
  initial_value: '0.0'
# Light control panel state
- id: current_light_entity
  type: std::string
  restore_value: no
  initial_value: '""'
- id: current_light_hue
  type: int
  restore_value: no
  initial_value: '30'
- id: current_light_saturation
  type: int
  restore_value: no
  initial_value: '100'
- id: current_light_brightness
  type: int
  restore_value: no
  initial_value: '255'
# Climate control panel state
- id: current_climate_entity
  type: std::string
  restore_value: no
  initial_value: '""'
- id: current_climate_target
  type: int
  restore_value: no
  initial_value: '24'
- id: current_climate_has_fan
  type: bool
  restore_value: no
  initial_value: 'false'