# font:
  - id: roboto_sm
    file:
      type: gfonts
      family: Roboto
    size: ${text_sm}
    bpp: 4

  - id: roboto_md
    file:
      type: gfonts
      family: Roboto
    size: ${text_md}
    bpp: 4

  - id: roboto_lg
    file:
      type: gfonts
      family: Roboto
    size: ${text_lg}
    bpp: 4

  - id: roboto_xl
    file:
      type: gfonts
      family: Roboto
    size: ${text_xl}
    bpp: 4

  # Used for exactly one label: the big current-temperature readout in the
  # climate panel, which is only ever set from snprintf("%.0f") or the
  # literal "--". Restricting the glyph set to those characters saves most
  # of the ~36 KB a full 48 px Roboto costs.
  - id: roboto_xxl
    file:
      type: gfonts
      family: Roboto
    size: ${text_xxl}
    bpp: 4
    glyphs: "-0123456789"

  - id: mdi_sm
    file: https://github.com/Pictogrammers/pictogrammers.github.io/raw/refs/heads/main/@mdi/font/7.4.47/fonts/materialdesignicons-webfont.ttf
    size: ${icons_sm}
    bpp: 4
    glyphs: !include glyphs.yaml

  - id: mdi_md
    file: https://github.com/Pictogrammers/pictogrammers.github.io/raw/refs/heads/main/@mdi/font/7.4.47/fonts/materialdesignicons-webfont.ttf
    size: ${icons_md}
    bpp: 4
    glyphs: !include glyphs.yaml

  - id: mdi_lg
    file: https://github.com/Pictogrammers/pictogrammers.github.io/raw/refs/heads/main/@mdi/font/7.4.47/fonts/materialdesignicons-webfont.ttf
    size: ${icons_lg}
    bpp: 4
    glyphs: !include glyphs.yaml

  - id: mdi_xl
    file: https://github.com/Pictogrammers/pictogrammers.github.io/raw/refs/heads/main/@mdi/font/7.4.47/fonts/materialdesignicons-webfont.ttf
    size: ${icons_xl}
    bpp: 4
    glyphs: !include glyphs.yaml
