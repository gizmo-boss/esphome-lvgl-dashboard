# MDI glyphs compiled into every mdi_* font size.
#
# Keep this list tight: each glyph is rasterised into all five sizes
# (20/26/34/42/50 px at 4 bpp), so one unused entry costs roughly 3 KB of
# flash. Before adding a size or a glyph, check it is actually referenced.
#
# Both spellings count as a reference: the escaped "\U000Fxxxx" form and
# the literal UTF-8 character.

- "\U000F0210" # fan
- "\U000F06E8" # lightbult-on
- "\U000F0336" # lightbulb-outline
- "\U000F0141" # chevron-left
- "\U000F0142" # chevron-right
- "\U000F0140" # chevron-down
- "\U000F02DC" # home
- "\U000F0425" # power
- "\U000F01D8" # dots-horizontal
- "\U000F0241" # flash (lightning bolt for power)
- "\U000F140B" # transmission-tower (grid)
- "\U000F12A3" # sine-wave (voltage/AC)
- "\U000F0493" # cog (settings)
- "\U000F00E0" # brightness-6 (brightness)
- "\U000F0156" # close (X)
- "\U000F17E0" # battery-charging (custom)
- "\U000F17DE" # battery-discharging (custom)
- "\U000F19E5" # battery-idle (custom)
- "\U000F012C" # check (checkmark)
- "\U000F05A9" # wifi
- "\U000F050F" # thermometer-lines (temperature)
- "\U000F058E" # water-percent (humidity)
- "\U000F0874" # gauge-full (pressure)
- "\U000F0393" # thermostat
- "\U000F001B" # air-conditioner-alt (F001B)
- "\U000F0238" # fire (heat)
- "\U000F0F29" # snowflake (cool)
- "\U000F0374" # minus-circle-outline
- "\U000F0417" # plus-circle-outline
- "\U000F0192" # clock-fast (auto mode)
- "\U000F078F" # alarm-light (air alert siren)
- "\U000F0028" # alert-circle
- "\U000F0150" # clock-outline (alert duration)
