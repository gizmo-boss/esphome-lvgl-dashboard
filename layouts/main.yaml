                service: light.toggle
                data: { entity_id: light.stylage_rgb_light}

        # Separator before Temp/Humidity
        - obj:
            width: 100%
            height: 2
            bg_color: 0x555555
            border_width: 0
            radius: 1
            scrollbar_mode: "off"
        - obj:
            # temperature sensor
