          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "°C";

  outdoor_humidity_sensor:
    sensor:
    - id: outdoor_humidity
      platform: homeassistant
      entity_id: sensor.outdoor_temp_sensor_humidity
      on_value:
      - lvgl.label.update:
          id: outdoor_humidity_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "%";

  # bedroom
  torsher_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: torsher, entity_id: switch.sonoff_10011cb02b } }
  bedroom_light_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: bedroom_light, entity_id: switch.sonoff_10012750d9_1 } }
  bedroom_temp_sensor:
    sensor:
    - id: bedroom_temp
      platform: homeassistant
      entity_id: sensor.bedroom_temp_temperature
      on_value:
      - lvgl.label.update:
          id: bedroom_temp_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "°C";

  #livingroom
  room_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: living_room_light, entity_id: switch.sonoff_1001275592_1 } }
  kitchen_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: kitchen_light, entity_id: switch.sonoff_1001275136_3 } }
  dinner_table_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: dinner_table, entity_id: switch.sonoff_1001275592_3 } }
  living_room_temp_sensor:
    sensor:
    - id: living_room_temp
      platform: homeassistant
      entity_id: sensor.livingroom_temp_temperature
      on_value:
      - lvgl.label.update:
          id: living_room_temp_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "°C";

  #bathroom
  bathroom_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: bathroom_light, entity_id: switch.sonoff_1001275189_1 } }
  mirror_light_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: mirror, entity_id: switch.sonoff_1001275189_2 } }
  fan__widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: fan, entity_id: switch.sonoff_1000af2f21_1 } }
  bathroom_temp_sensor:
