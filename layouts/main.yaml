globals:
  - id: display_is_off
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: auto_off_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: brightness_level
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: battery_time_status_str
    type: std::string
    restore_value: no
    initial_value: ''
  - id: battery_energy_remaining_val
    type: float
    restore_value: no
    initial_value: '0.0'

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42
    icons_xxl: 50

.sizing:
- &nav_widget_vars
  height: 50
  padding: 8

- &page_styles
  <<: !include styles/page_styles.yaml
  pad_top: 50
  pad_bottom: 50

- &container_styles
  <<: !include styles/container_styles.yaml
  pad_top: 0
  pad_bottom: 0
  pad_left: 6
  pad_right: 6

- &button_layout
  <<: !include styles/button_layout.yaml
  pad_column: 8
  pad_row: 8

- &button_widget_vars
  width: 49%
  height: 86

- &wide_button_widget_vars
  width: 100%
  height: 86

script:
- id: go_home
  then:
  - lvgl.page.show: bedroom

- id: turn_off_display
  then:
  - globals.set:
      id: display_is_off
      value: 'true'
  - light.turn_off: backlight

- id: turn_on_display
  then:
  - globals.set:
      id: display_is_off
      value: 'false'
  - light.turn_on: backlight
  - script.execute: go_home

- id: show_settings
  then:
  - lvgl.widget.show: settings_panel

- id: hide_settings
  then:
  - lvgl.widget.hide: settings_panel

- id: toggle_auto_off
  then:
  - lambda: |-
      id(auto_off_enabled) = !id(auto_off_enabled);
  - if:
      condition:
        lambda: 'return id(auto_off_enabled);'
      then:
      - lvgl.widget.show: auto_off_checked
      - lvgl.widget.hide: auto_off_unchecked
      else:
      - lvgl.widget.hide: auto_off_checked
      - lvgl.widget.show: auto_off_unchecked

lvgl:
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
    - <<: !include { file: widgets/header/widget.yaml, vars: { <<: *nav_widget_vars } }
    - <<: !include { file: widgets/footer/widget.yaml, vars: { <<: *nav_widget_vars } }
    - <<: !include { file: widgets/boot_screen/widget.yaml }
    # Settings Panel (hidden by default, shown on swipe down)
    - obj:
        id: settings_panel
        width: 100%
        height: 100%
        bg_color: 0x2A2E38
        bg_opa: 95%
        hidden: true
        scrollbar_mode: "off"
        widgets:
        # Header with close button
        - obj:
            width: 100%
            height: 50
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "off"
            widgets:
            - label:
                text: "\U000F0493"
                text_font: mdi_lg
                text_color: 0xFFFFFF
                align: LEFT_MID
                x: 12
            - label:
                text: "Settings"
                text_font: roboto_lg
                text_color: 0xFFFFFF
                align: LEFT_MID
                x: 50
            - button:
                width: 50
                height: 50
                align: RIGHT_MID
                bg_opa: TRANSP
                border_width: 0
                on_click:
                - script.execute: hide_settings
                widgets:
                - label:
                    text: "\U000F0156"
                    text_font: mdi_lg
                    text_color: 0xFF5555
                    align: CENTER
        # Content
        - obj:
            width: 100%
            height: 280
            y: 60
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "off"
            pad_left: 16
            pad_right: 16
            widgets:
            # Brightness label row
            - obj:
                width: 100%
                height: 40
                bg_opa: TRANSP
                border_width: 0
                scrollbar_mode: "off"
                widgets:
                - label:
                    text: "\U000F00E0"
                    text_font: mdi_lg
                    text_color: 0xFFCC00
                    align: LEFT_MID
                - label:
                    text: "Brightness"
                    text_font: roboto_md
                    align: LEFT_MID
                    x: 40
            # Brightness slider row
            - obj:
                width: 100%
                height: 50
                y: 45
                bg_opa: TRANSP
                border_width: 0
                scrollbar_mode: "off"
                widgets:
                - slider:
                    id: brightness_slider
                    width: 100%
                    height: 24
                    align: CENTER
                    min_value: 10
                    max_value: 100
                    value: 100
                    indicator:
                      bg_color: 0xFFCC00
                    knob:
                      bg_color: 0xFFFFFF
                      radius: 12
                    on_value:
                    - light.turn_on:
                        id: backlight
                        brightness: !lambda return x / 100.0;
                    - globals.set:
                        id: brightness_level
                        value: !lambda return x / 100.0;
            # Auto-off toggle row
            - button:
                width: 100%
                height: 60
                y: 110
                bg_color: 0x3A4050
                radius: 12
                border_width: 0
                on_click:
                - script.execute: toggle_auto_off
                widgets:
                - label:
                    text: "\U000F0425"
                    text_font: mdi_lg
                    text_color: 0x00B6FF
                    align: LEFT_MID
                    x: 12
                - label:
                    text: "Auto-off"
                    text_font: roboto_md
                    align: LEFT_MID
                    x: 52
                - obj:
                    id: auto_off_checked
                    width: 36
                    height: 36
                    align: RIGHT_MID
                    x: -12
                    bg_color: 0x4CAF50
                    radius: 6
                    border_width: 0
                    widgets:
                    - label:
                        text: "\U000F012C"
                        text_font: mdi_lg
                        text_color: 0xFFFFFF
                        align: CENTER
                - obj:
                    id: auto_off_unchecked
                    width: 36
                    height: 36
                    align: RIGHT_MID
                    x: -12
                    bg_color: 0x555555
                    radius: 6
                    border_width: 2
                    border_color: 0x888888
                    hidden: true
  pages:
  - id: splash
    skip: true
    on_load:
    - script.execute: go_home

  - id: bedroom
    <<: *page_styles
    scrollbar_mode: "off"
    on_load:
    - lvgl.label.update:
        id: page_title
        text: Bedroom
    widgets:
    - obj:
        <<: *container_styles
        scrollbar_mode: "off"
        scrollable: false
        layout:
          <<: *button_layout
          pad_row: 10
        widgets:
        # Separator at the top
        - obj:
            width: 100%
            height: 2
            bg_color: 0x555555
            border_width: 0
            radius: 1
            scrollbar_mode: "off"
        - button:
            # Bedroom Light
            <<: !include
              file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
              vars:
                uid: bedroom_light
                entity_id: switch.sonoff_10012750d9_1
                text: Bedroom Light
                <<: *button_widget_vars
            on_short_click:
            - homeassistant.service:
                service: switch.toggle
                data: { entity_id: switch.sonoff_10012750d9_1 }
        - button:
            # torsher
            <<: !include
              file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
              vars:
                uid: torsher
                entity_id: switch.bedroom_floor_lamp
                text: Torsher
                <<: *button_widget_vars
            on_short_click:
            # - logger.log: "MAIN Toggling switch switch.bedroom_floor_lamp"
            - homeassistant.service:
                service: switch.toggle
                data: { entity_id: switch.bedroom_floor_lamp }
        - button:
