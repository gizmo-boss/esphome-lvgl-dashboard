packages:
  # header
  header_sensors: !include { file: widgets/header/sensors.yaml }

  # boot screen
  boot_screen_sensors: !include { file: widgets/boot_screen/sensors.yaml }

  # energy sensors
  power_sensor:
    sensor:
    - id: power
      platform: homeassistant
      entity_id: sensor.apartment_power_input_phase_a_power
      on_value:
      - lvgl.label.update:
          id: power_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "kW";

  voltage_sensor:
    sensor:
    - id: voltage
      platform: homeassistant
      entity_id: sensor.apartment_power_input_phase_a_voltage
      on_value:
      - lvgl.label.update:
          id: voltage_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "V";

  battery_soc_sensor:
    sensor:
    - id: battery_soc
      platform: homeassistant
      entity_id: sensor.40517480283_battery_soc
      on_value:
      - lvgl.label.update:
          id: battery_soc_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "%";

  battery_voltage_sensor:
    sensor:
    - id: battery_voltage
      platform: homeassistant
      entity_id: sensor.40517480283_battery_voltage
      on_value:
      - lvgl.label.update:
