globals: !include globals.yaml

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42

# Nav widget sizing
.sizing:
- &nav_widget_vars
  height: 50
  padding: 8

script: !include scripts.yaml

lvgl:
  default_font: roboto_md
  theme: !include themes/main.yaml
  # This qspi_dbi panel doesn't reliably apply partial-window updates, which
  # is why content stayed blank until something forced a full frame (e.g. a
  # touch). Redrawing the whole frame every time avoids relying on that.
  full_refresh: true
  top_layer:
    widgets:
    - <<: !include { file: widgets/header/widget.yaml, vars: { <<: *nav_widget_vars } }
    - <<: !include { file: widgets/footer/widget.yaml, vars: { <<: *nav_widget_vars } }
    - <<: !include { file: widgets/boot_screen/widget.yaml }
    # Settings Panel (hidden by default, shown on swipe down)
    - <<: !include widgets/settings_panel/widget.yaml
    # Light Control Panel (hidden by default, shown on long press)
    - <<: !include widgets/light_control_panel/widget.yaml
    # Climate Control Panel (hidden by default, shown on click)
    - <<: !include widgets/climate_control_panel/widget.yaml
  pages:
  - id: splash
    skip: true
    on_load:
    - script.execute: go_home

  - <<: !include pages/bedroom.yaml
  - <<: !include pages/living_room.yaml
  - <<: !include pages/bathroom.yaml
  - <<: !include pages/corridor.yaml
  - <<: !include pages/outdoor.yaml
  - <<: !include pages/energy.yaml
  - <<: !include pages/climate.yaml
  - <<: !include pages/air_alerts.yaml

packages:
  # header
  header_sensors: !include { file: widgets/header/sensors.yaml }

  # boot screen
  boot_screen_sensors: !include { file: widgets/boot_screen/sensors.yaml }

  # settings initialization
  <<: !include sensors/settings.yaml

  # bedroom sensors
  <<: !include sensors/bedroom.yaml

  # living room sensors
  <<: !include sensors/living_room.yaml

  # bathroom sensors
  <<: !include sensors/bathroom.yaml

  # corridor sensors
  <<: !include sensors/corridor.yaml

  # outdoor sensors
  <<: !include sensors/outdoor.yaml

  # energy sensors
  <<: !include sensors/energy.yaml

  # climate sensors
  <<: !include sensors/climate.yaml

  # air alerts sensors
  <<: !include sensors/air_alerts.yaml
