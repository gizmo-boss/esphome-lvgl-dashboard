                text: "--"
                text_font: roboto_xl
                align: LEFT_MID
                x: 30
                y: 14
        # Separator between Grid and Battery
        - obj:
            width: 100%
            height: 2
            bg_color: 0x555555
            border_width: 0
            radius: 1
            scrollbar_mode: "off"
        # Row 2: Battery SoC - horizontal battery with percentage inside
        - obj:
            width: 100%
            height: 50
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "off"
            widgets:
            # Battery terminal (left side)
            - obj:
                width: 8
                height: 20
                bg_color: 0xFFFFFF
                border_width: 0
                radius: 2
                align: LEFT_MID
                x: 6
                scrollbar_mode: "off"
            # Battery container (main body)
            - obj:
                id: battery_container
                width: 92%
                height: 40
                bg_color: 0x2A2E38
                border_width: 2
                border_color: 0xFFFFFF
                radius: 4
                align: RIGHT_MID
                x: -10
                pad_all: 0
                scrollbar_mode: "off"
                widgets:
                # Filled part indicator (for color change) - full height, fills from right
                - obj:
                    id: battery_soc_fill
                    width: 0
                    height: 100%
                    bg_color: 0x4CAF50
                    border_width: 0
                    radius: 2
                    align: RIGHT_MID
                    pad_all: 0
                    scrollbar_mode: "off"
                # Percentage text inside battery
                - label:
                    id: battery_soc_value
                    text: "--%"
                    text_font: roboto_lg
                    text_color: 0xFFFFFF
                    align: CENTER
                # Energy value in brackets (smaller font) - right of percentage
                - label:
                    id: battery_energy_value
                    text: ""
                    text_font: roboto_sm
                    text_color: 0xFFFFFF
                    align: RIGHT_MID
                    x: -10
        # Row 3: Battery Voltage & Power
        - obj:
            width: 49%
            height: 70
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "off"
            widgets:
            - label:
                text_font: mdi_xl
                text: "\U000F12A3"
                text_color: 0x9575CD
                align: LEFT_MID
                x: -10
            - label:
                text: "Batt Voltage"
                text_font: roboto_sm
                text_color: 0x888888
                align: LEFT_MID
                x: 30
                y: -18
            - label:
                id: battery_voltage_value
                text: "--"
                text_font: roboto_xl
                align: LEFT_MID
                x: 30
                y: 14
        - obj:
            width: 49%
            height: 70
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "off"
            widgets:
            - label:
                text_font: mdi_xl
                id: battery_power_icon
                text: "\U000F0241"
                text_color: 0x4CAF50
                align: LEFT_MID
                x: -10
            - label:
                text: "Batt Power"
                text_font: roboto_sm
                text_color: 0x888888
                align: LEFT_MID
                x: 30
                y: -18
            - label:
                id: battery_power_value
                text: "--"
                text_font: roboto_xl
                align: LEFT_MID
                x: 20
                y: 14
        # Separator between Battery and New Sensors
        - obj:
            width: 100%
            height: 2
            bg_color: 0x555555
            border_width: 0
            radius: 1
            scrollbar_mode: "off"
        # Row 4: Battery Time Dynamic
        - obj:
            width: 100%
            height: 86
            bg_opa: TRANSP
            border_width: 0
            scrollbar_mode: "off"
            widgets:
            - label:
                id: battery_time_icon
                text_font: mdi_lg
                text: "\U000F19E5"
                text_color: 0x888888
                align: LEFT_MID
                x: -5
            - label:
                id: battery_time_primary
                text: "--"
                text_font: roboto_sm
                text_color: 0x888888
                align: LEFT_MID
                x: 30
                y: -18
            - label:
                id: battery_time_secondary
                text: "--"
                text_font: roboto_xl
                text_color: 0xFFFFFF
                align: LEFT_MID
                x: 30
                y: 14

packages:
  # header
  header_sensors: !include { file: widgets/header/sensors.yaml }

  # boot screen
  boot_screen_sensors: !include { file: widgets/boot_screen/sensors.yaml }

  # settings initialization
  settings_init:
    esphome:
      on_boot:
        priority: -100
        then:
        - delay: 500ms
        - lvgl.slider.update:
            id: brightness_slider
            value: !lambda return (int)(id(brightness_level) * 100);
        - light.turn_on:
            id: backlight
            brightness: !lambda return id(brightness_level);
        - if:
            condition:
              lambda: 'return id(auto_off_enabled);'
            then:
            - lvgl.widget.show: auto_off_checked
            - lvgl.widget.hide: auto_off_unchecked
            else:
            - lvgl.widget.hide: auto_off_checked
            - lvgl.widget.show: auto_off_unchecked

  # energy sensors
  power_sensor:
    sensor:
    - id: power
      platform: homeassistant
      entity_id: sensor.apartment_power_input_phase_a_power
      on_value:
      - lvgl.label.update:
          id: power_value
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1fkW", x);
            return std::string(buf);

  voltage_sensor:
    sensor:
    - id: voltage
      platform: homeassistant
      entity_id: sensor.apartment_power_input_phase_a_voltage
      on_value:
      - lvgl.label.update:
          id: voltage_value
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0fV", x);
            return std::string(buf);

  battery_soc_sensor:
    sensor:
    - id: battery_soc
      platform: homeassistant
      entity_id: sensor.40517480283_battery_soc
      on_value:
      - lambda: |-
          if (std::isnan(x)) {
            lv_label_set_text(id(battery_soc_value), "--%");
            lv_label_set_text(id(battery_energy_value), "");
            return;
          }
          int percent = (int)std::round(x);
          char buf[16];
          snprintf(buf, sizeof(buf), "%d%%", percent);
          lv_label_set_text(id(battery_soc_value), buf);
          // Energy will be updated separately
      - lambda: |-
          if (std::isnan(x)) {
            lv_obj_set_width(id(battery_soc_fill), 0);
            lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(0x888888), LV_PART_MAIN);
            return;
          }
          int percent = (int)std::round(x);
          int container_width = lv_obj_get_width(id(battery_container));
          int container_height = lv_obj_get_height(id(battery_container));
          lv_obj_set_width(id(battery_soc_fill), (container_width * percent) / 100);
          lv_obj_set_height(id(battery_soc_fill), container_height);
          if (percent >= 60) {
            lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(0x4CAF50), LV_PART_MAIN); // green
          } else if (percent >= 30) {
            lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(0xFFCC00), LV_PART_MAIN); // yellow
          } else {
            lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(0xFF5252), LV_PART_MAIN); // red
          }

  battery_voltage_sensor:
    sensor:
    - id: battery_voltage
      platform: homeassistant
      entity_id: sensor.40517480283_battery_voltage
      on_value:
      - lvgl.label.update:
          id: battery_voltage_value
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1fV", x);
            return std::string(buf);

  battery_power_sensor:
    sensor:
    - id: battery_power
      platform: homeassistant
      entity_id: sensor.40517480283_battery_power
      on_value:
      - lvgl.label.update:
          id: battery_power_value
          text: !lambda |-
            if (std::isnan(x)) return std::string("--");
            char buf[16];
            int val = (int)std::round(x);
            if (val > 0) snprintf(buf, sizeof(buf), "+%dW", val);
            else snprintf(buf, sizeof(buf), "%dW", val);
            return std::string(buf);
          text_color: !lambda |-
            if (std::isnan(x)) return lv_color_hex(0x888888);
            if (x > 0) return lv_color_hex(0x4CAF50);   // green = charging
            else if (x < 0) return lv_color_hex(0xFF9800); // orange = discharging
            else return lv_color_hex(0xFFFFFF);         // white = idle
      - lvgl.label.update:
          id: battery_power_icon
          text_color: !lambda |-
            if (std::isnan(x)) return lv_color_hex(0x888888);
            if (x > 0) return lv_color_hex(0x4CAF50);   // green = charging
            else if (x < 0) return lv_color_hex(0xFF9800); // orange = discharging
            else return lv_color_hex(0xFFFFFF);         // white = idle

  battery_time_dynamic_sensor:
    text_sensor:
    - id: battery_time_status
      platform: homeassistant
      entity_id: sensor.battery_time_dynamic_2
      attribute: status
      on_value:
      - globals.set:
          id: battery_time_status_str
          value: !lambda return x;
      - lambda: |-
          std::string status = x;
          // Update primary text
          if (status == "Charging") {
            lv_label_set_text(id(battery_time_primary), "Time to Full");
            lv_label_set_text(id(battery_time_icon), "\U000F17E0"); // battery-charging
            lv_obj_set_style_text_color(id(battery_time_icon), lv_color_hex(0x4CAF50), LV_PART_MAIN); // green
            lv_obj_set_style_text_color(id(battery_time_primary), lv_color_hex(0x888888), LV_PART_MAIN); // green
          } else if (status == "Discharging") {
            lv_label_set_text(id(battery_time_primary), "Time to Empty");
            lv_label_set_text(id(battery_time_icon), "\U000F17DE"); // battery-discharging
            lv_obj_set_style_text_color(id(battery_time_icon), lv_color_hex(0xFF9800), LV_PART_MAIN); // orange
            lv_obj_set_style_text_color(id(battery_time_primary), lv_color_hex(0x888888), LV_PART_MAIN); // orange
          } else if (status == "Standby") {
            lv_label_set_text(id(battery_time_primary), "Standby");
            lv_label_set_text(id(battery_time_icon), "\U000F19E5"); // battery-idle
            lv_obj_set_style_text_color(id(battery_time_icon), lv_color_hex(0x888888), LV_PART_MAIN); // grey
            lv_obj_set_style_text_color(id(battery_time_primary), lv_color_hex(0x888888), LV_PART_MAIN); // grey
          } else {
            lv_label_set_text(id(battery_time_primary), "—");
            lv_label_set_text(id(battery_time_icon), "\U000F19E5"); // battery-idle
            lv_obj_set_style_text_color(id(battery_time_icon), lv_color_hex(0x888888), LV_PART_MAIN); // grey
            lv_obj_set_style_text_color(id(battery_time_primary), lv_color_hex(0x888888), LV_PART_MAIN); // grey
          }
    - id: battery_time_value
      platform: homeassistant
      entity_id: sensor.battery_time_dynamic_2
      on_value:
      - lambda: |-
          std::string status = id(battery_time_status_str);
          if (status == "Charging" || status == "Discharging") {
            if (x.empty()) {
              lv_label_set_text(id(battery_time_secondary), "--");
            } else {
              lv_label_set_text(id(battery_time_secondary), x.c_str());
            }
          } else {
            lv_label_set_text(id(battery_time_secondary), "");
          }

  battery_energy_remaining_sensor:
    sensor:
    - id: battery_energy_remaining
      platform: homeassistant
      entity_id: sensor.battery_energy_remaining_2
      on_value:
      - globals.set:
          id: battery_energy_remaining_val
          value: !lambda return x;
      - lambda: |-
          // Update battery Energy label
          if (std::isnan(x) || x == 0.0) {
            lv_label_set_text(id(battery_energy_value), "");
          } else {
            char buf[32];
            snprintf(buf, sizeof(buf), "(%.0f Wh)", x);
            lv_label_set_text(id(battery_energy_value), buf);
          }

  # outdoor sensors
  outdoor_temp_sensor:
    sensor:
    - id: outdoor_temp
      platform: homeassistant
      entity_id: sensor.outdoor_temp_sensor_temperature
      on_value:
      - lvgl.label.update:
          id: outdoor_temp_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "°C";

  outdoor_humidity_sensor:
    sensor:
    - id: outdoor_humidity
      platform: homeassistant
      entity_id: sensor.outdoor_temp_sensor_humidity
      on_value:
      - lvgl.label.update:
          id: outdoor_humidity_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "%";
  
  outdoor_pressure_sensor:
    sensor:
    - id: outdoor_pressure
      platform: homeassistant
      entity_id: sensor.outdoor_temp_sensor_pressure
      on_value:
      - lvgl.label.update:
          id: outdoor_pressure_value
          text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "hPa";        

  # bedroom
  torsher_widget_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: torsher, entity_id: switch.bedroom_floor_lamp } }
  bedroom_light_sensors: !include { file: widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: bedroom_light, entity_id: switch.sonoff_10012750d9_1 } }
