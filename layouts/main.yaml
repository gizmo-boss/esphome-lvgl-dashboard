globals:
  - id: display_is_off
    type: bool
    restore_value: no
    initial_value: 'false'

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42
    icons_xxl: 50

.sizing:
- &nav_widget_vars
  height: 50
  padding: 8

- &page_styles
  <<: !include styles/page_styles.yaml
  pad_top: 50
  pad_bottom: 50

- &container_styles
  <<: !include styles/container_styles.yaml
  pad_top: 0
  pad_bottom: 0
  pad_left: 6
  pad_right: 6

- &button_layout
  <<: !include styles/button_layout.yaml
  pad_column: 8
  pad_row: 8

- &button_widget_vars
  width: 49%
  height: 86

- &wide_button_widget_vars
  width: 100%
  height: 86

script:
- id: go_home
  then:
  - lvgl.page.show: bedroom

- id: turn_off_display
  then:
  - globals.set:
      id: display_is_off
      value: 'true'
  - light.turn_off: backlight

- id: turn_on_display
  then:
  - globals.set:
      id: display_is_off
      value: 'false'
  - light.turn_on: backlight
  - script.execute: go_home

lvgl:
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
    - <<: !include { file: widgets/header/widget.yaml, vars: { <<: *nav_widget_vars } }
    - <<: !include { file: widgets/footer/widget.yaml, vars: { <<: *nav_widget_vars } }
    - <<: !include { file: widgets/boot_screen/widget.yaml }
  pages:
  - id: splash
    skip: true
    on_load:
    - script.execute: go_home

  - id: bedroom
    <<: *page_styles
    on_load:
    - lvgl.label.update:
        id: page_title
        text: Bedroom
    widgets:
    - obj:
        <<: *container_styles
        layout:
          <<: *button_layout
        widgets:
        - button:
            # Bedroom Light
            <<: !include
              file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
              vars:
                uid: bedroom_light
                entity_id: switch.sonoff_10012750d9_1
                text: Bedroom Light
                <<: *button_widget_vars
            on_short_click:
            - homeassistant.service:
                service: switch.toggle
                data: { entity_id: switch.sonoff_10012750d9_1 }
        - button:
            # torsher
            <<: !include
              file: widgets/buttons/icon_text_buttons/light_buttons/widget.yaml
              vars:
                uid: torsher
                entity_id: switch.sonoff_10011cb02b
                text: Torsher
                <<: *button_widget_vars
            on_short_click:
            # - logger.log: "MAIN Toggling switch switch.sonoff_10011cb02b"
            - homeassistant.service:
                service: switch.toggle
                data: { entity_id: switch.sonoff_10011cb02b }

        - obj:
            # temperature sensor
            width: 100%
            height: 85
            widgets:
            - label:
                id: bedroom_temp_label
                text: "Temp"
                text_font: roboto_lg
                align: LEFT_MID
            - label:
                id: bedroom_temp_value
                text: "..."
                text_font: roboto_lg
                align: RIGHT_MID

  - id: living_room
    <<: *page_styles
    on_load:
