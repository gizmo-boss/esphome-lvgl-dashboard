# Battery SoC sensor
battery_soc_sensor:
  sensor:
  - id: battery_soc
    platform: homeassistant
    entity_id: sensor.40517480283_battery_soc
    on_value:
    - lambda: |-
        if (std::isnan(x)) {
          lv_label_set_text(id(battery_soc_value), "--%");
          lv_label_set_text(id(battery_energy_value), "");
          return;
        }
        int percent = (int)std::round(x);
        char buf[16];
        snprintf(buf, sizeof(buf), "%d%%", percent);
        lv_label_set_text(id(battery_soc_value), buf);
        // Energy will be updated separately
    - lambda: |-
        if (std::isnan(x)) {
          lv_obj_set_width(id(battery_soc_fill), 0);
          lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_text_muted}), LV_PART_MAIN);
          return;
        }
        int percent = (int)std::round(x);
        int container_width = lv_obj_get_width(id(battery_container));
        int container_height = lv_obj_get_height(id(battery_container));
        lv_obj_set_width(id(battery_soc_fill), (container_width * percent) / 100);
        lv_obj_set_height(id(battery_soc_fill), container_height);
        if (percent >= 60) {
          lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_success}), LV_PART_MAIN); // green
        } else if (percent >= 30) {
          lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_warning}), LV_PART_MAIN); // yellow
        } else {
          lv_obj_set_style_bg_color(id(battery_soc_fill), lv_color_hex(${color_danger}), LV_PART_MAIN); // red
        }

