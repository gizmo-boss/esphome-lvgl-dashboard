# Grid power sensor
power_sensor:
  sensor:
  - id: power
    platform: homeassistant
    entity_id: sensor.apartment_power_input_phase_a_power
    on_value:
    - lvgl.label.update:
        id: power_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[16];
          snprintf(buf, sizeof(buf), "%.1fkW", x);
          return std::string(buf);

# Voltage sensor
voltage_sensor:
  sensor:
  - id: voltage
    platform: homeassistant
    entity_id: sensor.apartment_power_input_phase_a_voltage
    on_value:
    - lvgl.label.update:
        id: voltage_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[16];
          snprintf(buf, sizeof(buf), "%.0fV", x);
