# Outdoor temperature sensor
outdoor_temp_sensor:
  sensor:
  - id: outdoor_temp
    platform: homeassistant
    entity_id: sensor.outdoor_temp_sensor_temperature
    on_value:
    - lvgl.label.update:
        id: outdoor_temp_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[16];
          snprintf(buf, sizeof(buf), "%.1f°C", x);
          return std::string(buf);

