# Outdoor pressure sensor.
# Rendered without decimals: 0.1 hPa is below the sensor's meaningful
# resolution, and "1013" fits the card where "1013.2" does not.
outdoor_pressure_sensor:
  sensor:
  - id: outdoor_pressure
    platform: homeassistant
    entity_id: sensor.outdoor_temp_sensor_pressure
    on_value:
    - lvgl.label.update:
        id: outdoor_pressure_value
        text: !lambda |-
          if (std::isnan(x)) return std::string("--");
          char buf[16];
          snprintf(buf, sizeof(buf), "%.0f", x);
          return std::string(buf);
