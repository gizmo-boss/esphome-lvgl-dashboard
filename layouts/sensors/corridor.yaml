# Corridor widget sensors
corridor_light_widget_sensors: !include { file: ../widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: corridor_light, entity_id: switch.sonoff_1001275136_2 } }
mcloset_light_widget_sensors: !include { file: ../widgets/buttons/icon_text_buttons/light_buttons/sensors.yaml, vars: { uid: closet_light, entity_id: switch.sonoff_1000b1b936_3 } }

# Corridor temperature sensor
corridor_temp_sensor:
  sensor:
  - id: corridor_temp
    platform: homeassistant
    entity_id: sensor.corridor_temp_temperature
    on_value:
    - lvgl.label.update:
        id: corridor_temp_value
        text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "°C";

# Corridor humidity sensor
corridor_humidity_sensor:
  sensor:
  - id: corridor_humidity
    platform: homeassistant
    entity_id: sensor.corridor_temp_humidity
    on_value:
    - lvgl.label.update:
        id: corridor_humidity_value
        text: !lambda return std::to_string(std::round(x * 10) / 10.0).substr(0, std::to_string(std::round(x * 10) / 10.0).find(".") + 2) + "%";
