# Climate sensors and controls

# ============ THERMOSTAT SENSORS ============
thermostat_sensors:
  sensor:
    - id: thermostat_current_temp_sensor
      platform: homeassistant
      entity_id: climate.thermostat_thermostat
      attribute: current_temperature
      on_value:
        - lvgl.label.update:
            id: thermostat_current_temp
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return std::string(buf);
        # Update panel if this device is open
        - if:
            condition:
              lambda: return id(current_climate_entity) == "climate.thermostat_thermostat";
            then:
            - lvgl.label.update:
                id: climate_current_temp_big
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%.0f", x);
                  return std::string(buf);

    - id: thermostat_target_temp_sensor
      platform: homeassistant
      entity_id: climate.thermostat_thermostat
      attribute: temperature
      on_value:
        - lvgl.label.update:
            id: thermostat_target_temp
            text: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return std::string(buf);
        # Update panel if this device is open
        - if:
            condition:
              lambda: return id(current_climate_entity) == "climate.thermostat_thermostat";
            then:
            - globals.set:
                id: current_climate_target
                value: !lambda return (int)x;
            - lambda: lv_arc_set_value(id(climate_temp_arc), (int)x);
            - lvgl.label.update:
                id: climate_target_temp_big
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%.0f°C", x);
                  return std::string(buf);

  text_sensor:
    - id: thermostat_hvac_state
      platform: homeassistant
      entity_id: climate.thermostat_thermostat
      on_value:
        - lvgl.label.update:
            id: thermostat_status
            text: !lambda return x;
        - if:
            condition:
              lambda: return id(current_climate_entity) == "climate.thermostat_thermostat";
            then:
            - lvgl.label.update:
                id: climate_control_status
                text: !lambda return x;
        - if:
            condition:
              lambda: return x == "off";
            then:
              - lvgl.widget.update:
                  id: thermostat_icon_circle
                  bg_color: 0x42495A
              - lvgl.label.update:
                  id: thermostat_icon
                  text_color: 0x9DA0A6
            else:
              - lvgl.widget.update:
                  id: thermostat_icon_circle
                  bg_color: 0x5C3A1A
              - lvgl.label.update:
                  id: thermostat_icon
                  text_color: 0xFF8C00

    - id: thermostat_hvac_action
      platform: homeassistant
      entity_id: climate.thermostat_thermostat
      attribute: hvac_action
      on_value:
        - if:
            condition:
              lambda: return x == "heating";
            then:
              - lvgl.widget.update:
                  id: thermostat_icon_circle
                  bg_color: 0x5C2A1A
              - lvgl.label.update:
                  id: thermostat_icon
                  text: "\U000F0238"
                  text_color: 0xFF5722
            else:
              - if:
                  condition:
                    lambda: return x == "idle";
                  then:
                    - lvgl.label.update:
                        id: thermostat_icon
                        text: "\U000F0393"

