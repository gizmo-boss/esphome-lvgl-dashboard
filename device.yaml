esphome:
  platformio_options:
    upload_speed: 921600

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz # 120MHz is not supported and falls back to 40MHz

spi:
  - type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

i2c:
  - sda: 4
    scl: 8

output:
  - id: gpio_backlight_pwm
    platform: ledc
    pin: 1

light:
  - id: backlight
    name: Backlight
    platform: monochromatic
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_ON

display:
  - id: main_display
    platform: qspi_dbi
    dimensions:
      height: 480
      width: 320
    model: JC4832W535
    data_rate: 40MHz
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    draw_from_origin: true
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - id: main_touchscreen
    platform: axs15231
    touch_timeout: 50ms
    update_interval: 50ms
    address: 0x3B
    on_touch:
      - lambda: |-
          id(last_touch_time) = millis();
          ESP_LOGD("touch", "x=%d, y=%d, x_raw=%d, y_raw=%d",
            touch.x,
            touch.y,
            touch.x_raw,
            touch.y_raw
          );
      # Wake the backlight only. LVGL is left paused so this press is
      # swallowed: Touchscreen::loop() runs LVTouchListener::update() before
      # firing on_touch, so touch_pressed_ was already latched to false.
      - if:
          condition:
            lambda: 'return !id(display_on);'
          then:
            - script.execute: wake_display
    # Resume LVGL once the finger is lifted. Doing it here rather than in
    # on_touch matters: the touchscreen re-reads every 50 ms, so resuming
    # while the finger is still down would let a long wake-up press through.
    on_release:
      - if:
          condition:
            - lvgl.is_paused:
            - lambda: 'return id(display_on);'
          then:
            - lvgl.resume: